<!DOCTYPE html>
<html>

<head>

    <title>Movie Recommender System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#141E30,#243B55);
            color:white;
            text-align:center;
        }

        .container{
            width:90%;
            margin:auto;
            padding:40px 0;
        }

        h1{
            font-size:45px;
            margin-bottom:30px;
            color:#00e5ff;
        }

        form{
            margin-bottom:40px;
        }

        select{
            width:350px;
            padding:12px;
            border:none;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }

        button{
            padding:12px 25px;
            margin-left:10px;
            border:none;
            border-radius:8px;
            background:#00b894;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#009975;
            transform:scale(1.05);
        }

        .movies{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:25px;
        }

        .card{
            width:200px;
            background:white;
            color:black;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.4);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-10px);
        }

        .card img{
            width:100%;
            height:300px;
            object-fit:cover;
        }

        .card h3{
            padding:15px;
            font-size:18px;
        }

    </style>

</head>

<body>

<div class="container">

<h1>🎬 Movie Recommender System</h1>

<form method="POST">


<select name="movie">

    {% for movie in movie_list %}

    <option value="{{ movie }}"
        {% if movie == selected_movie %}selected{% endif %}>
        {{ movie }}
    </option>

    {% endfor %}

</select>

<button type="submit">
Recommend
</button>

</form>

<div class="movies">

{% for movie in recommendations %}

<div class="card">

<img src="{{ movie.poster }}">

<h3>{{ movie.title }}</h3>

</div>

{% endfor %}

</div>

</div>

</body>

</html>
